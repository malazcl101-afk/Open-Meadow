<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e2eee5"><meta name="description" content="Open Meadow, a private homeschool planning and record keeping app by HarborNestDigital."><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><title>Open Meadow · HarborNestDigital</title></head><body>
<div id="app"><div class="loading" role="status">Opening Open Meadow…</div></div>
<dialog id="mobileSections" aria-labelledby="moreTitle"><div class="dialog-head"><h2 id="moreTitle">Explore the planner</h2><button class="icon-button" type="button" data-close-menu aria-label="Close menu">×</button></div><nav class="menu-grid" aria-label="All planner sections">
<section><h3>Plan & learn</h3><button data-view="dashboard">Overview</button><button data-view="planner">Lessons</button><button data-view="calendar">Calendar</button><button data-view="assignments">Assignments</button><button data-view="year">School year</button><button data-view="family">Family events</button></section>
<section><h3>Track progress</h3><button data-view="students">Students & subjects</button><button data-view="attendance">Attendance</button><button data-view="gradebook">Gradebook</button><button data-view="progress">Student progress</button><button data-view="assessments">Assessments</button><button data-view="curriculum">Curriculum</button></section>
<section><h3>Grow & remember</h3><button data-view="reading">Reading</button><button data-view="goals">Goals</button><button data-view="projects">Projects & awards</button><button data-view="enrichment">Enrichment & portfolio</button></section>
<section><h3>Organize</h3><button data-view="compliance">Records & hours</button><button data-view="budget">Budget</button><button data-view="reports">Reports</button><button data-view="library">Notes & resources</button><button data-view="settings">Customize & backup</button></section></nav></dialog>
<dialog id="editor" aria-labelledby="dialogTitle"><form id="recordForm"><div class="dialog-head"><div><span class="eyebrow">OPEN MEADOW</span><h2 id="dialogTitle">Add a record</h2></div><button class="icon-button" type="button" id="closeDialog" aria-label="Close dialog">×</button></div><div id="formFields"></div><div class="dialog-actions"><button class="button primary" type="submit">Save record</button><button class="button secondary" type="button" id="cancelDialog">Cancel</button></div></form></dialog>
<input id="backupInput" type="file" accept=".json,application/json" hidden><script src="./app.js" defer></script></body></html>
